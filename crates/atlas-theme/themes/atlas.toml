#:schema ../schema/theme-v1.json
schema = 1
id = "atlas"
name = "Atlas"
author = "Atlas contributors"
license = "Apache-2.0"

# Atlas Standards — the design system the desktop, web and mobile apps share.
# Every value here is that system's `themes.css`, in the same order of ideas:
#
#  - Achromatic. Chrome is OKLCH with zero chroma; the action colour is the
#    foreground INVERTED, never a brand hue.
#  - Chroma has two jobs only: four status inks, and eight identity hues.
#  - The surface ramp climbs monotonically from the page: background 0.08 →
#    surface 0.10 → card 0.12 → illustration 0.13 → raised 0.15 → popover 0.17,
#    set into a lighter canvas (0.17) with an opaque edge (0.27). In light, "up"
#    saturates at white after the card and the ring carries the hierarchy.
#  - Edges and element states are the foreground at an alpha, so they composite
#    on any step and invert for free.
#
# Change a value in Standards first, then here. The palette, the chart series
# and the shadows are written as the sRGB those OKLCH values convert to: the
# crate's checks on hue names, chart separation and the light shadow ramp read
# hex and rgba.

[dark.base]
"background" = "oklch(0.08 0 0)"
"foreground" = "oklch(0.97 0 0)"
"card" = "oklch(0.12 0 0)"
"card-foreground" = "oklch(0.97 0 0)"
"popover" = "oklch(0.17 0 0)"
"popover-foreground" = "oklch(0.97 0 0)"
"primary" = "oklch(0.97 0 0)"
"primary-foreground" = "oklch(0.08 0 0)"
"secondary" = "oklch(0.16 0 0)"
"secondary-foreground" = "oklch(0.8 0 0)"
"muted" = "oklch(0.15 0 0)"
"muted-foreground" = "oklch(0.62 0 0)"
"accent" = "oklch(0.16 0 0)"
"accent-foreground" = "oklch(0.97 0 0)"
"destructive" = "oklch(0.68 0.19 22)"
"destructive-foreground" = "oklch(0.99 0 0)"
"border" = "oklch(1 0 0 / 8%)"
"input" = "oklch(1 0 0 / 10%)"
"ring" = "oklch(0.97 0 0 / 40%)"
# Charts are achromatic steps; a categorical chart reaches for the hue keys.
"chart-1" = "#f5f5f5"
"chart-2" = "#b7b7b7"
"chart-3" = "#808080"
"chart-4" = "#4d4d4d"
"chart-5" = "#292929"
"sidebar" = "oklch(0.1 0 0)"
"sidebar-foreground" = "oklch(0.97 0 0)"
"sidebar-primary" = "oklch(0.97 0 0)"
"sidebar-primary-foreground" = "oklch(0.08 0 0)"
"sidebar-accent" = "oklch(0.15 0 0)"
"sidebar-accent-foreground" = "oklch(0.97 0 0)"
"sidebar-border" = "oklch(1 0 0 / 6%)"
"sidebar-ring" = "oklch(0.97 0 0 / 40%)"
"radius" = "8px"
"font-sans" = "\"Geist Variable\", -apple-system, \"SF Pro Text\", system-ui, sans-serif"
"font-serif" = "ui-serif, Georgia, Cambria, \"Times New Roman\", serif"
"font-mono" = "\"Geist Mono Variable\", \"SF Mono\", \"JetBrains Mono\", monospace"
"tracking-normal" = "0em"
"spacing" = "0.25rem"
# Standards has two rungs, md and lg, for what floats over content. The rest
# stay until the sweep retires the last raised shadow.
"shadow-2xs" = "0 1px 2px rgba(0, 0, 0, 0.35)"
"shadow-xs" = "0 1px 2px rgba(0, 0, 0, 0.45)"
"shadow-sm" = "0 1px 3px rgba(0, 0, 0, 0.55)"
"shadow-md" = "0 4px 12px rgba(0, 0, 0, 0.55)"
"shadow-lg" = "0 8px 24px rgba(0, 0, 0, 0.65), 0 16px 48px rgba(0, 0, 0, 0.6)"
"shadow-xl" = "0 12px 36px rgba(0, 0, 0, 0.82)"
"shadow-2xl" = "0 16px 48px rgba(0, 0, 0, 0.9)"

# The palette feeds terminal ANSI and anything a third-party theme derives;
# here it is the identity hues, so the two agree.
[dark.palette]
red = "#ff6d79"
orange = "#ff8e4d"
yellow = "#f3af49"
green = "#50c582"
cyan = "#3dc7c9"
blue = "#4e96ff"
purple = "#b180fc"
pink = "#ed76b3"

